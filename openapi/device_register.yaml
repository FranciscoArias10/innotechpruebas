openapi: 3.0.3
info:
  title: SIGE-UBE — API móvil
  version: 1.0.0
  description: |
    Endpoints de soporte para clientes móviles.

    **El sobre de respuesta es siempre el mismo:**

    ```json
    {"isSuccess": true, "message": "texto", "data": {}}
    ```

    El campo es `isSuccess`, no `success`. Varias especificaciones antiguas del
    sistema dicen `success` y están equivocadas.

servers:
  - url: https://sige-staging.innotech-solutions.com.ec/api/v1.0.0
    description: Staging (datos sintéticos)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Sobre:
      type: object
      required: [isSuccess, message]
      properties:
        isSuccess: { type: boolean }
        message:   { type: string, nullable: true }

    Dispositivo:
      type: object
      required: [id, plataforma, app_version, modelo_dispositivo, activo]
      properties:
        id:                 { type: integer, example: 12 }
        plataforma:         { type: string, enum: [Android, iOS] }
        app_version:        { type: string, example: "1.0.0" }
        modelo_dispositivo: { type: string, example: "Pixel 7" }
        activo:             { type: boolean }

    RespuestaDispositivo:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Dispositivo' }

    RespuestaError:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

security:
  - bearerAuth: []

paths:
  /movil/device/register/:
    post:
      summary: Registra o actualiza el token push de un dispositivo
      description: |
        Idempotente: repetir el mismo `token` actualiza la fila existente.
        Devuelve 201 la primera vez y 200 en las siguientes.
      operationId: registrarDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, plataforma]
              properties:
                token:              { type: string, maxLength: 255 }
                plataforma:         { type: string, enum: [android, ios] }
                app_version:        { type: string, maxLength: 20 }
                modelo_dispositivo: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Dispositivo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaDispositivo' }
        '201':
          description: Dispositivo registrado por primera vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaDispositivo' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaError' }
        '401':
          description: Falta el token JWT o está vencido

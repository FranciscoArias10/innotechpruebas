          - juan.garcia@institucion.edu.ec
          - juan@correo.com
        phone:
          type: string
          nullable: true
          example: 0999654321
        enrollment_status:
          $ref: '#/components/schemas/EstadoMatriculaDocente'
        attendance_percentage:
          type: number
          format: float
          example: 95.5
        final_grade:
          type: number
          format: float
          nullable: true
          example: 9.25
    SubjectStudentsData:
      type: object
      required:
      - subject
      - total_students
      - students
      properties:
        subject:
          $ref: '#/components/schemas/MateriaInfoDocente'
        total_students:
          type: integer
          example: 25
        students:
          type: array
          items:
            $ref: '#/components/schemas/EstudianteRosterItem'
    RespuestaSubjectStudents:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SubjectStudentsData'
  parameters:
    XPeriodIDHeader:
      name: X-Period-ID
      in: header
      required: false
      description: ID del periodo lectivo (opcional si se pasa period_id en query).
      schema:
        type: integer
        example: 6
    MateriaAsignadaIDPath:
      name: materia_asignada_id
      in: path
      required: true
      description: ID de la MateriaAsignada.
      schema:
        type: integer
        example: 12345
    StudentIDPath:
      name: student_id
      in: path
      required: true
      description: ID del estudiante representado.
      schema:
        type: integer
        example: 4412
    MateriaAsignadaIDQuery:
      name: materia_asignada_id
      in: query
      required: true
      description: ID de la materia asignada al estudiante.
      schema:
        type: integer
        example: 123
    MateriaIDPath:
      name: materia_id
      in: path
      required: true
      description: ID de la Materia.
      schema:
        type: integer
        example: 456
paths:
  /movil/app/version/:
    get:
      summary: Consulta la versión mínima soportada y si requiere actualización forzada.
      description: 'No requiere autenticación. Retorna la información de versión para
        la plataforma indicada.

        Se puede pasar la plataforma como query parameter (ej: `?plataforma=android`
        o `?plataforma=ios`).

        Si no se indica plataforma, por defecto asume `android`.

        '
      operationId: consultarVersionApp
      parameters:
      - name: plataforma
        in: query
        required: false
        schema:
          type: string
          enum:
          - android
          - ios
          default: android
      responses:
        '200':
          description: Versión recuperada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAppVersion'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '429':
          description: Límite de tasa excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/sign-in/:
    post:
      summary: Autentica un usuario y devuelve tokens JWT
      description: 'Autentica usuario por `username` (o correo) y `password`.

        Retorna tokens JWT `access` y `refresh`, información del usuario, roles, periodos
        y flag de cambio obligatorio de clave.

        '
      operationId: autenticarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: jperez
                  description: Nombre de usuario o dirección de correo electrónico
                password:
                  type: string
                  example: MiClave123
                  description: Contraseña del usuario
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSignIn'
        '401':
          description: Credenciales inválidas, usuario no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/refresh/:
    post:
      summary: Obtiene un nuevo access token usando el refresh token
      description: 'Al usar este endpoint, el refresh token anterior se invalida (lista
        negra) y se entrega un nuevo par de tokens.

        '
      operationId: renovarToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh
              properties:
                refresh:
                  type: string
                  description: Refresh token JWT válido
      responses:
        '200':
          description: Tokens renovados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRefresh'
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/sign-out/:
    post:
      summary: Cierra la sesión e invalida el refresh token
      description: 'Requiere autenticación mediante el access token en `Authorization:
        Bearer <token>`.

        Invalida (añade a la lista negra) el refresh token enviado en el cuerpo.

        '
      operationId: cerrarSesion
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh
              properties:
                refresh:
                  type: string
                  description: Refresh token a invalidar
      responses:
        '205':
          description: Sesión cerrada exitosamente (Reset Content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSignOut'
        '400':
          description: Solicitud inválida (falta el refresh token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado o token expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/recover-password/:
    post:
      summary: Recuperación/reset de contraseña
      description: 'Resetea la contraseña a una clave aleatoria segura y la envía
        por correo electrónico a la persona asociada al usuario.

        '
      operationId: recuperarPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              properties:
                username:
                  type: string
                  example: jperez
                  description: Nombre de usuario
      responses:
        '200':
          description: Nueva contraseña enviada por correo electrónico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecoverPassword'
        '400':
          description: Usuario no existe, persona no existe o no tiene correos registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/recover-username/:
    post:
      summary: Recuperación de nombre de usuario por cédula
      description: 'Obtiene el nombre de usuario y el nombre completo dada la cédula
        de la persona.

        '
      operationId: recuperarUsername
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cedula
              properties:
                cedula:
                  type: string
                  example: '1234567890'
                  description: Número de cédula de la persona
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecoverUsername'
        '400':
          description: Persona no existe o cédula no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /auth/change-password/:
    post:
      summary: Cambio de contraseña para usuario autenticado
      description: 'Permite a un usuario autenticado modificar su contraseña actual.
        Revisa políticas de seguridad (mínimo 8 caracteres, mayúsculas, minúsculas,
        números, sin espacios, diferente a cédula y clave actual).

        '
      operationId: cambiarPassword
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - old_password
              - new_password
              - repeat_password
              properties:
                old_password:
                  type: string
                  example: MiClaveAnterior123
                  description: Contraseña actual
                new_password:
                  type: string
                  example: MiNuevaClave456
                  description: Nueva contraseña
                repeat_password:
                  type: string
                  example: MiNuevaClave456
                  description: Confirmación de la nueva contraseña
      responses:
        '200':
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChangePassword'
        '400':
          description: Clave insegura, claves no coinciden, o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado o token expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /config/branding/:
    get:
      summary: Configuración de branding e identidad visual
      description: 'Retorna logotipos, paleta de colores, enlaces a redes sociales
        y datos de la institución para personalización dinámica de clientes móviles
        y web.

        '
      operationId: obtenerBranding
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Configuración de branding obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaBranding'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error al obtener la configuración de branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /student/calendar/:
    get:
      summary: Calendario y agenda de actividades
      description: 'Retorna la lista de actividades del estudiante filtradas por rango
        de fecha (vista agenda, mensual o semanal).

        '
      operationId: obtenerCalendario
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XPeriodIDHeader'
      - name: period_id
        in: query
        required: false
        schema:
          type: integer
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - agenda
          - month
          - week
          default: agenda
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2025-12-01'
      - name: subject_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Actividades de calendario obtenidas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCalendar'
        '400':
          description: Vista no válida, formato de fecha inválido o sin periodo activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Sin perfil estudiante o sin acceso al periodo/materia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /student/activity/{id}/:
    get:
      summary: Detalle de una actividad específica
      description: 'Retorna la información completa de una actividad (instrucciones
        en HTML, archivos adjuntos, enlaces y estado de entrega).

        '
      operationId: obtenerDetalleActividad
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 123
      responses:
        '200':
          description: Detalle de la actividad obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivityDetail'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Actividad no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /chat-ia/config/:
    get:
      summary: Configuración pública de ChatIA
      description: 'Retorna la identidad pública del asistente IA (ej: Amani) para
        ser mostrada en la interfaz del cliente. No requiere token.

        '
      operationId: obtenerConfigPublicaChatIA
      security: []
      responses:
        '200':
          description: Configuración pública obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChatIAPublicConfig'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /chat-ia/sessions/:
    get:
      summary: Lista de sesiones de chat activas
      description: 'Retorna la lista de conversaciones activas del usuario autenticado
        (excluye las eliminadas por soft-delete).

        '
      operationId: listarSesionesChat
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de sesiones obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListarSesiones'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /chat-ia/sessions/{session_id}/:
    patch:
      summary: Renombrar título de una sesión
      description: 'Permite actualizar el título personalizado de una sesión activa
        (máximo 100 caracteres).

        '
      operationId: renombrarSesionChat
      security:
      - bearerAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                  maxLength: 100
                  example: Mi título personalizado
      responses:
        '200':
          description: Título de la sesión actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRenombrarSesion'
        '400':
          description: Título requerido o excede 100 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '410':
          description: La sesión fue eliminada (SESSION_DELETED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    delete:
      summary: Eliminar una sesión de chat (Soft delete)
      description: 'Marca la sesión como eliminada (`status=''deleted''`). Endpoint
        idempotente.

        '
      operationId: eliminarSesionChat
      security:
      - bearerAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Sesión eliminada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEliminarSesion'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno al eliminar sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /student/subjects/{materia_asignada_id}/planning/:
    get:
      summary: Planificación semanal de clases de una materia
      description: 'Retorna los contenidos, unidades, recursos, actividades y controles
        de navegación de la planificación de clase de una semana dada.

        '
      operationId: obtenerPlanificacionClase
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MateriaAsignadaIDPath'
      - $ref: '#/components/parameters/XPeriodIDHeader'
      - name: week
        in: query
        required: false
        description: Número de la semana (1-based). Prioridad sobre fecha.
        schema:
          type: integer
          example: 3
      - name: date
        in: query
        required: false
        description: Fecha ISO 8601 de referencia.
        schema:
          type: string
          format: date
          example: '2025-11-18'
      - name: activities_limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      - name: activities_offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Planificación semanal obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaClassPlanning'
        '400':
          description: Parámetros inválidos o falta header X-Period-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado o token expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Perfil o permisos insuficientes (IDOR check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Materia o semana no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno al obtener planificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /movil/device/register/:
    post:
      summary: Registra o actualiza el token push de un dispositivo
      description: 'Idempotente: repetir el mismo `token` actualiza la fila existente.

        Devuelve 201 la primera vez y 200 en las siguientes.

        '
      operationId: registrarDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - plataforma
              properties:
                token:
                  type: string
                  maxLength: 255
                plataforma:
                  type: string
                  enum:
                  - android
                  - ios
                app_version:
                  type: string
                  maxLength: 20
                modelo_dispositivo:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: Dispositivo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDispositivo'
        '201':
          description: Dispositivo registrado por primera vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDispositivo'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Falta el token JWT o está vencido
  /movil/feedback/:
    post:
      summary: Enviar feedback o reporte desde la app.
      description: "Crea un nuevo registro de feedback asociado al usuario autenticado.\
        \ \nEste endpoint cuenta con un límite de tasa estricto (ej. 2 peticiones\
        \ por hora).\n"
      operationId: enviarFeedback
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackMovilCreate'
      responses:
        '201':
          description: Feedback enviado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '400':
          description: Faltan datos requeridos o son inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token no provisto o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '429':
          description: Límite de peticiones excedido (Throttling).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /movil/notifications/preferences/:
    get:
      summary: Consulta las preferencias de notificación del usuario autenticado.
      description: 'Retorna las preferencias configuradas para el usuario actual.

        Si es la primera consulta del usuario, se inicializan automáticamente con
        los valores por defecto (todos activados).

        '
      operationId: consultarPreferenciasNotificacion
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Preferencias recuperadas con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPreferencias'
        '401':
          description: No autenticado o token vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    put:
      summary: Actualiza las preferencias de notificación del usuario autenticado.
      description: 'Permite actualizar parcial e idempotentemente una o más preferencias
        de notificación.

        Los campos no especificados conservan su valor actual.

        '
      operationId: actualizarPreferenciasNotificacion
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciaNotificacionUpdate'
      responses:
        '200':
          description: Preferencias actualizadas con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPreferencias'
        '400':
          description: Datos enviados inválidos (p. ej. tipos no booleanos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado o token vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /movil/representative/students/{student_id}/attendance/:
    get:
      summary: Asistencia de un estudiante representado
      description: 'Devuelve el consolidado de asistencia de un estudiante.

        Requiere que el usuario autenticado sea representante del estudiante indicado.

        '
      operationId: obtenerAsistenciaEstudianteRepresentado
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/StudentIDPath'
      - $ref: '#/components/parameters/XPeriodIDHeader'
      responses:
        '200':
          description: Asistencia obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAsistenciaEstudiante'
        '400':
          description: Header X-Period-ID faltante o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autenticado o token expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: El usuario autenticado no representa a este estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':

openapi: 3.0.3
info:
  title: SIGE-UBE — API móvil
  version: 1.0.0
  description: Especificación completa de la API Móvil SIGE-UBE (12 módulos).
servers:
- url: https://sige.innotech-solutions.com.ec/api/v1.0.0
  description: Staging (datos sintéticos)
- url: http://localhost:8000/api/v1.0.0
  description: Servidor Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Sobre:
      type: object
      required:
      - isSuccess
      - message
      properties:
        isSuccess:
          type: boolean
        message:
          type: string
          nullable: true
    AppVersionInfo:
      type: object
      required:
      - plataforma
      - version_minima
      - version_actual
      - forzar_actualizacion
      properties:
        plataforma:
          type: string
          enum:
          - android
          - ios
        version_minima:
          type: string
          example: 1.0.0
        version_actual:
          type: string
          example: 1.2.0
        forzar_actualizacion:
          type: boolean
          example: false
    RespuestaAppVersion:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/AppVersionInfo'
    RespuestaError:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    UsuarioInfo:
      type: object
      required:
      - id
      - username
      - email
      - first_name
      - last_name
      - is_staff
      - is_superuser
      - is_active
      - date_joined
      properties:
        id:
          type: integer
          example: 123
        username:
          type: string
          example: jperez
        email:
          type: string
          example: jperez@example.com
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Pérez
        is_staff:
          type: boolean
          example: false
        is_superuser:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        date_joined:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
    PeriodoInfo:
      type: object
      required:
      - id
      - name
      - is_active
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: 2024-2025
        is_active:
          type: boolean
          example: true
    SignInData:
      type: object
      required:
      - access
      - refresh
      - user
      - profiles
      - password_change_required
      - periods
      - active_period_id
      properties:
        access:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        refresh:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        user:
          $ref: '#/components/schemas/UsuarioInfo'
        profiles:
          type: array
          items:
            type: string
            enum:
            - student
            - teacher
            - representative
            - admin
          example:
          - student
          - representative
        password_change_required:
          type: boolean
          example: false
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PeriodoInfo'
        active_period_id:
          type: integer
          example: 5
    RefreshData:
      type: object
      required:
      - access
      - refresh
      properties:
        access:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        refresh:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
    RecoverPasswordData:
      type: object
      required:
      - emails
      properties:
        emails:
          type: string
          example: jperez@gmail.com, jperez@institution.edu.ec
    RecoverUsernameData:
      type: object
      required:
      - username
      - full_name
      properties:
        username:
          type: string
          example: jperez
        full_name:
          type: string
          example: Juan Carlos Pérez López
    RespuestaSignIn:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SignInData'
    RespuestaRefresh:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/RefreshData'
    RespuestaSignOut:
      $ref: '#/components/schemas/Sobre'
    RespuestaRecoverPassword:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/RecoverPasswordData'
    RespuestaRecoverUsername:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/RecoverUsernameData'
    RespuestaChangePassword:
      $ref: '#/components/schemas/Sobre'
    RedesSociales:
      type: object
      properties:
        facebook:
          type: string
          nullable: true
          example: https://www.facebook.com/miinstitucion
        instagram:
          type: string
          nullable: true
          example: https://www.instagram.com/miinstitucion
        twitter:
          type: string
          nullable: true
          example: null
        youtube:
          type: string
          nullable: true
          example: null
    BrandingData:
      type: object
      required:
      - name
      - name_key
      - slogan
      - base_path
      - email_domain
      - phone
      - address
      - website_url
      - logo_sign_in
      - logo_sm_sign_in
      - logo_admin
      - logo_sm_admin
      - favicon
      - logo_email_banner
      - logo_email_footer
      - color_primary
      - color_secondary
      - social
      - platform_version
      properties:
        name:
          type: string
          example: Sistema Integrado de Gestión Educativa
        name_key:
          type: string
          example: SIGE
        slogan:
          type: string
          example: Educación de calidad para todos
        base_path:
          type: string
          example: https://sige.example.edu.ec/
        email_domain:
          type: string
          example: example.edu.ec
        phone:
          type: string
          example: 0999123456
        address:
          type: string
          example: 'Av. Principal #123, Guayaquil, Ecuador'
        website_url:
          type: string
          example: https://example.edu.ec
        logo_sign_in:
          type: string
          example: /media/repositorio/pdf/2024/01/logo-sign-in.png
        logo_sm_sign_in:
          type: string
          example: /media/repositorio/pdf/2024/01/logo-sm-sign-in.png
        logo_admin:
          type: string
          example: /media/repositorio/pdf/2024/01/logo-admin.png
        logo_sm_admin:
          type: string
          example: /media/repositorio/pdf/2024/01/logo-admin-sm.png
        favicon:
          type: string
          example: /static/v-1.0.0/img/favicon.png
        logo_email_banner:
          type: string
          example: /static/v-1.0.0/img/logo-email-banner.png
        logo_email_footer:
          type: string
          example: /static/v-1.0.0/img/logo-email-footer.png
        color_primary:
          type: string
          example: '#04205b'
        color_secondary:
          type: string
          example: '#ffaa46'
        social:
          $ref: '#/components/schemas/RedesSociales'
        platform_version:
          type: string
          example: 0.1.5
    RespuestaBranding:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/BrandingData'
    ActividadTipo:
      type: object
      required:
      - id
      - name
      - icon_url
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Tarea
        icon_url:
          type: string
          nullable: true
          example: /media/icono/2024/01/tarea.svg
    GradingInfo:
      type: object
      properties:
        cohort:
          type: string
          nullable: true
          example: PRIMER QUIMESTRE
        grading_book:
          type: string
          nullable: true
          example: TAREAS
        category:
          type: string
          nullable: true
          example: Trabajo individual
    SubjectSummaryItem:
      type: object
      required:
      - id
      - name
      - parallel
      properties:
        id:
          type: integer
          example: 45
        name:
          type: string
          example: MATEMÁTICAS
        parallel:
          type: string
          example: A
    StatusActividadCalendar:
      type: object
      required:
      - code
      - label
      - badge
      properties:
        code:
          type: string
          enum:
          - pending
          - submitted
          - completed
          - overdue
          example: pending
        label:
          type: string
          example: Pendiente
        badge:
          type: string
          enum:
          - warning
          - info
          - success
          - danger
          example: warning
    SubmissionInfo:
      type: object
      required:
      - required
      - submitted
      - deadline_passed
      properties:
        required:
          type: boolean
          example: true
        submitted:
          type: boolean
          example: false
        deadline_passed:
          type: boolean
          example: false
    ActividadCalendarItem:
      type: object
      required:
      - id
      - title
      - description
      - start
      - end
      - color
      - type
      - grading_type
      - delivery_type
      - requires_submission
      - grading_info
      - subject
      - status
      - submission
      - attachments
      - links
      - time_remaining
      - week_number
      - can_submit
      properties:
        id:
          type: integer
          example: 123
        title:
          type: string
          example: 'Tarea: Ejercicios de Matemáticas'
        description:
          type: string
          example: Resolver ejercicios del capítulo 5...
        start:
          type: string
          format: date-time
          example: '2025-12-10T08:00:00-05:00'
        end:
          type: string
          format: date-time
          example: '2025-12-15T23:59:00-05:00'
        color:
          type: string
          example: '#E57373'
        type:
          $ref: '#/components/schemas/ActividadTipo'
        grading_type:
          type: string
          nullable: true
          example: Cuantitativa
        delivery_type:
          type: string
          nullable: true
          example: Permitir envío
        requires_submission:
          type: boolean
          example: true
        grading_info:
          $ref: '#/components/schemas/GradingInfo'
          nullable: true
        subject:
          $ref: '#/components/schemas/SubjectSummaryItem'
        status:
          $ref: '#/components/schemas/StatusActividadCalendar'
        submission:
          $ref: '#/components/schemas/SubmissionInfo'
        attachments:
          type: object
          properties:
            has_attachments:
              type: boolean
              example: true
            count:
              type: integer
              example: 1
        links:
          type: object
          properties:
            has_links:
              type: boolean
              example: false
        time_remaining:
          type: string
          nullable: true
          example: 5 días, 3 horas
        week_number:
          type: integer
          example: 12
        can_submit:
          type: boolean
          example: true
    CalendarSummary:
      type: object
      required:
      - total
      - pending
      - completed
      - overdue
      properties:
        total:
          type: integer
          example: 15
        pending:
          type: integer
          example: 5
        completed:
          type: integer
          example: 8
        overdue:
          type: integer
          example: 2
    CalendarData:
      type: object
      required:
      - view
      - period
      - range
      - summary
      - activities
      properties:
        view:
          type: string
          enum:
          - agenda
          - month
          - week
          example: agenda
        period:
          type: object
          properties:
            id:
              type: integer
              example: 6
            name:
              type: string
              example: PERIODO LECTIVO 2024 - 2025
        range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          $ref: '#/components/schemas/CalendarSummary'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActividadCalendarItem'
    RespuestaCalendar:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/CalendarData'
    RespuestaActivityDetail:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/ActividadCalendarItem'
    ChatIAPublicConfigData:
      type: object
      required:
      - assistant_name
      - platform_name
      - platform_version
      properties:
        assistant_name:
          type: string
          example: Amani
          description: Nombre del asistente IA
        platform_name:
          type: string
          example: SIGE
          description: Nombre corto del sistema
        platform_version:
          type: string
          example: 0.1.1
          description: Versión de la plataforma
    RespuestaChatIAPublicConfig:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/ChatIAPublicConfigData'
    SesionChatIA:
      type: object
      required:
      - id
      - title
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: a3b8e90c-1234-5678-90ab-cdef12345678
        title:
          type: string
          example: Consulta sobre horario
        status:
          type: string
          enum:
          - active
          - deleted
          example: active
        created_at:
          type: string
          format: date-time
          example: '2025-12-31T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-12-31T10:30:00Z'
    SesionEliminadaData:
      type: object
      required:
      - id
      - status
      - deleted_at
      properties:
        id:
          type: string
          format: uuid
          example: a3b8e90c-1234-5678-90ab-cdef12345678
        status:
          type: string
          example: deleted
        deleted_at:
          type: string
          format: date-time
          example: '2025-12-31T16:30:00Z'
    RespuestaListarSesiones:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/SesionChatIA'
    RespuestaRenombrarSesion:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SesionChatIA'
    RespuestaEliminarSesion:
      allOf:
      - $ref: '#/components/schemas/Sobre'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SesionEliminadaData'
    RecursoTipo:
      type: object
      required:
      - code
      - name
      - icon_url
      properties:
        code:
          type: string
          enum:
          - video
          - link
          - pdf
          - doc
          - excel
          - ppt
          - image
          - file
          - folder
          example: video
        name:
          type: string
          example: Video
        icon_url:
          type: string
          nullable: true
          example: /media/icono/video.svg
    RecursoLink:
      type: object
      required:
      - id
      - name
      - url
      - type
      - type_icon
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: OBSERVE EL VIDEO NOCIONES DEL TIEMPO
        url:
          type: string
          nullable: true
          example: https://youtube.com/...
        type:
          $ref: '#/components/schemas/RecursoTipo'
        type_icon:
          type: string
          nullable: true
          example: /media/icono/link.svg
    RecursoArchivo:
      type: object
      required:
      - id
      - name
      - download_url
      - type
      - type_icon
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: MATERIAL DE APOYO.pdf
        download_url:
          type: string
          nullable: true
          example: /download/...
        type:
          $ref: '#/components/schemas/RecursoTipo'
        type_icon:
          type: string
          nullable: true
          example: /media/icono/pdf.svg
    RecursoCarpeta:
      type: object
      required:
      - id
      - name
      - type
      - type_icon
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Material complementario
        type:
          $ref: '#/components/schemas/RecursoTipo'
        type_icon:
          type: string
          nullable: true
          example: /media/icono/folder.svg
    RecursosContenedor:
      type: object
      required:
      - links
      - files
      - folders
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/RecursoLink'
        files:
          type: array
          items:
            $ref: '#/components/schemas/RecursoArchivo'
        folders:
          type: array
          items:
            $ref: '#/components/schemas/RecursoCarpeta'
    SubtemaInfo:
      type: object
      required:
      - id
      - name
      - content
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: MEDIDAS DE TIEMPO
        content:
          type: string
          example: <html>...
    TemaInfo:
      type: object
      required:
      - id
      - name
      - content
      - subtopics
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: SOY EL SEÑOR METRO
        content:
          type: string
          example: <html>...
        subtopics:
          type: array
          items:
            $ref: '#/components/schemas/SubtemaInfo'
    UnidadInfo:
      type: object
      required:
      - id
      - name
      - objective
      - topics
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'UNIDAD # 5'
        objective:
          type: string
          example: Comprender los conceptos de medición...
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TemaInfo'
    PlanificacionContenido:
      type: object
      required:
      - units
      - bibliographies
      - methodological_strategies
      - resources
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnidadInfo'
        bibliographies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: Libro de Matemáticas 8vo
        methodological_strategies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: Trabajo en grupo
        resources:
          $ref: '#/components/schemas/RecursosContenedor'
    ActividadEstado:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
          enum:
          - pending
          - submitted
          - overdue
          example: pending
        label:
          type: string
          example: Pendiente
    ActividadPlanificada:
      type: object
      required:
      - id
      - name
      - type
      - start_date
      - end_date
      - status
      - has_attachment
      - attachment_url
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: ACTIVIDAD EN CLASE EXPUESTA EN UNA HOJA DE TRABAJO
        type:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Actividad
            icon_url:
              type: string
              nullable: true
              example: /media/icono/actividad.svg
        start_date:
          type: string
          format: date-time
          example: '2025-11-18T07:00:00-05:00'
        end_date:
          type: string
          format: date-time
          example: '2025-11-18T12:00:00-05:00'
        status:
          $ref: '#/components/schemas/ActividadEstado'
        has_attachment:
          type: boolean
          example: true
        attachment_url:
          type: string
          nullable: true
          example: /download/...
    ActividadesPaginadas:
      type: object
      required:
      - items
      - total
      - pending_count
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActividadPlanificada'
        total:
          type: integer
          example: 3
        pending_count:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    NavegacionSemana:
      type: object
      required:
      - total_weeks
      - current_week
      - previous_week
      - next_week
      properties:
        total_weeks:
          type: integer
          example: 43
        current_week:
          type: integer
          nullable: true
          example: 3
        previous_week:
          type: integer
          nullable: true
          example: 2
        next_week:
          type: integer
          nullable: true
          example: 4
    SemanaDetalle:
      type: object
      required:
      - order
      - name
      - start_date
      - end_date
      - has_previous
      - has_next
      - pending_activities
      properties:
        order:
          type: integer
          example: 3
        name:
          type: string
          example: SEMANA 3 TT
        start_date:
          type: string
          format: date
          nullable: true
          example: '2025-11-17'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2025-11-23'
        has_previous:
          type: boolean
          example: true
        has_next:
          type: boolean
          example: true
        pending_activities:
          type: integer
          example: 1
    MateriaHeader:
      type: object
      required:
      - id
      - name
      - level
      - parallel
      - start_date
      - end_date
      - total_weeks
      - pending_activities
      properties:
        id:
          type: integer
          example: 12345
        name:
          type: string
          example: MATEMÁTICAS
        level:
          type: string
          example: 8vo EGB
        parallel:
          type: string
          example: A
        start_date:
          type: string
          format: date
          nullable: true
          example: '2025-04-16'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-02-28'
        total_weeks:
          type: integer
          example: 43
        pending_activities:
          type: integer
          example: 5
    ClassPlanningData:
      type: object
      required:
      - subject
      - week
      - content
      - activities
